[package]
name = "spotty"
version = "0.2.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "http"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
